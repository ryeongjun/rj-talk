<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chats - rjtalk</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="status-bar">
      <div class="status-bar__column">
        <span>23:30</span>
      </div>
      <div class="status-bar__column">
        <div class="punch-hole"></div>
      </div>
      <div class="status-bar__column">
        <i class="fa-solid fa-signal fa-lg"></i>
        <span>5G</span>
        <i class="fa-solid fa-battery-full fa-2x"></i>
      </div>
    </div>
    <header class="screen-header">
      <h1 class="screen-header__title">Chats</h1>
      <div class="screen-header__icons">
        <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
        <span><i class="fa-solid fa-comment-dots fa-lg"></i></span>
        <span><i class="fa-solid fa-music fa-lg"></i></span>
        <span><i class="fa-solid fa-gear fa-lg"></i></span>
      </div>
    </header>

    <main class="main-screen chats-screen">
      <a href="chat.html">
        <div class="user-component">
          <div class="user-component__column">
            <img
              src="https://i.namu.wiki/i/JqXkB47VuslQ36F04iAh2FowCOUw9XeTsO0SrvETGDWxr4CzGAX20Gvm8AL0C1-xhY6q10Uuz1UUFTLvkGCuMfsd9LHxM4fW_lc45M-2L_P3o4PbQLsKqI67-08C59HwqTj3vOemIrgNP5SEzM4ZJA.webp"
              class="user-component__avatar"
            />
            <div class="user-component__text">
              <h4 class="user-component__title">Ron Weasley</h4>
              <h6 class="user-component__subtitle">
                I was up until 1 AM last night...
              </h6>
            </div>
          </div>
          <div class="user-component__column">
            <span class="user-component__time">23:05</span>
            <div class="badge-alert">3</div>
          </div>
        </div>
      </a>
    </main>
    <nav class="nav">
      <ul class="nav__list">
        <li class="nav__btn">
          <a href="friends.html"><i class="fa-regular fa-user fa-2x"></i></a>
        </li>
        <li class="nav__btn">
          <a href="chats.html"
            ><i class="fa-solid fa-comment fa-2x"></i>
            <span class="badge-alert">3</span></a
          >
        </li>
        <li class="nav__btn">
          <a href="find.html"
            ><i class="fa-solid fa-magnifying-glass fa-2x"></i
          ></a>
        </li>
        <li class="nav__btn">
          <a href="more.html"><i class="fa-solid fa-ellipsis fa-2x"></i></a>
          <div class="badge-more"></div>
        </li>
      </ul>
    </nav>
    <div id="no-mobile">
      <span>Your screen is too big :(</span>
      <span>Please reduce the width to 600px or less.</span>
    </div>
  </body>
  <script
    src="https://kit.fontawesome.com/3af4690456.js"
    crossorigin="anonymous"
  ></script>
</html>
