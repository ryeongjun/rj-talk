<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat - rjtalk</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body id="chat-screen">
    <div class="status-bar">
      <div class="status-bar__column">
        <span>23:30</span>
      </div>
      <div class="status-bar__column">
        <div class="punch-hole"></div>
      </div>
      <div class="status-bar__column">
        <i class="fa-solid fa-signal fa-lg"></i>
        <span>5G</span>
        <i class="fa-solid fa-battery-full fa-2x"></i>
      </div>
    </div>

    <header class="alt-header">
      <div class="alt-header__column">
        <a href="chats.html"><i class="fa-solid fa-angle-left fa-2x"></i></a>
      </div>
      <div class="alt-header__column">
        <h1 class="alt-header__title">Ron Weasley</h1>
      </div>
      <div class="alt-header__column">
        <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
        <span><i class="fa-solid fa-bars fa-lg"></i></span>
      </div>
    </header>

    <main class="main-screen main-chat">
      <div class="chat-date">Sunday, Mar 2, 2025</div>
      <div class="message-row">
        <div class="message-row__column">
          <div class="message-row__avatar">
            <img src="images/weasley.png" />
          </div>
        </div>
        <div class="message-row__column">
          <div class="message-row__name">Ron Weasley</div>
          <div class="message-row__body">
            <div class="message-row__text">
              <div class="message-row__text-first">This term is doomed.</div>
              <div class="message-row__text-second">
                I can't even try defensive spells.
              </div>
              <div class="message-row__text-third">
                I was up until 1 AM last night just practicing spells!
              </div>
            </div>
            <div class="message-row__time">11:02</div>
          </div>
        </div>
      </div>
    </main>

    <div id="no-mobile">
      <span>Your screen is too big :(</span>
      <span>Please reduce the width to 600px or less.</span>
    </div>
  </body>
  <script
    src="https://kit.fontawesome.com/3af4690456.js"
    crossorigin="anonymous"
  ></script>
</html>
