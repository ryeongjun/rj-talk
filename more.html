<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>More - rjtalk</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="status-bar">
      <div class="status-bar__column">
        <span>23:30</span>
      </div>
      <div class="status-bar__column">
        <div class="punch-hole"></div>
      </div>
      <div class="status-bar__column">
        <i class="fa-solid fa-signal fa-lg"></i>
        <span>5G</span>
        <i class="fa-solid fa-battery-full fa-2x"></i>
      </div>
    </div>
    <header class="screen-header more-header">
      <h1 class="screen-header__title">More</h1>
      <div class="screen-header__icons">
        <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
        <span><i class="fa-solid fa-expand fa-lg"></i></span>
        <a href="settings.html"
          ><span><i class="fa-solid fa-gear fa-lg"></i></span
        ></a>
      </div>
    </header>

    <main class="main-screen more-screen">
      <div class="pay-component">
        <div class="pay-component__column">
          <i class="fa-solid fa-comment"></i><span>Pay</span>
        </div>
        <div class="pay-component__column">
          <span>Transfer</span>
          <div class="divider"></div>
          <span>Assets</span>
          <div class="divider"></div>
          <i class="fa-solid fa-barcode"></i><span>Pay</span>
        </div>
      </div>
      <div class="icon-component">
        <div class="icon-component__column">
          <i class="fa-solid fa-store fa-2x"></i>
          <span>Shop</span>
        </div>
        <div class="icon-component__column">
          <i class="fa-solid fa-gift fa-2x"></i>
          <span>Gift</span>
        </div>
        <div class="icon-component__column">
          <i class="fa-regular fa-face-smile fa-2x"></i>
          <span>Emoji</span>
        </div>
        <div class="icon-component__column">
          <i class="fa-regular fa-calendar fa-2x"></i>
          <span>Calendar</span>
        </div>
      </div>
      <div class="more-screen__suggestion">
        <h6>Suggestions</h6>
      </div>
      <div class="icon-component">
        <div class="icon-component__column">
          <i class="fa-solid fa-qrcode fa-2x"></i>
          <span>Game</span>
        </div>
        <div class="icon-component__column">
          <i class="fa-regular fa-address-book fa-2x"></i>
          <span>Book</span>
        </div>
        <div class="icon-component__column">
          <i class="fa-solid fa-headset fa-2x"></i>
          <span>Live</span>
        </div>
        <div class="icon-component__column">
          <i class="fa-solid fa-cart-shopping fa-2x"></i>
          <span>OneClick</span>
        </div>
      </div>
    </main>
    <nav class="nav">
      <ul class="nav__list">
        <li class="nav__btn">
          <a href="friends.html"><i class="fa-regular fa-user fa-2x"></i></a>
        </li>
        <li class="nav__btn">
          <a href="chats.html"
            ><i class="fa-regular fa-comment fa-2x"></i>
            <span class="badge-alert">3</span></a
          >
        </li>
        <li class="nav__btn">
          <a href="find.html"
            ><i class="fa-solid fa-magnifying-glass fa-2x"></i
          ></a>
        </li>
        <li class="nav__btn">
          <a href="more.html"><i class="fa-solid fa-ellipsis fa-2x"></i></a>
          <div class="badge-more"></div>
        </li>
      </ul>
    </nav>
    <div id="no-mobile">
      <span>Your screen is too big :(</span>
      <span>Please reduce the width to 600px or less.</span>
    </div>
  </body>
  <script
    src="https://kit.fontawesome.com/3af4690456.js"
    crossorigin="anonymous"
  ></script>
</html>
