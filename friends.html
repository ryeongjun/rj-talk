<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends - Chat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="status-bar">
      <div class="status-bar__column">
        <span>23:30</span>
      </div>
      <div class="status-bar__column">
        <div class="punch-hole"></div>
      </div>
      <div class="status-bar__column">
        <i class="fa-solid fa-signal fa-lg"></i>
        <span>5G</span>
        <i class="fa-solid fa-battery-full fa-2x"></i>
      </div>
    </div>
    <header class="screen-header">
      <h1 class="screen-header__title">Friends</h1>
      <div class="screen-header__icons">
        <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
        <span><i class="fa-solid fa-user-plus fa-lg"></i></span>
        <span><i class="fa-solid fa-music fa-lg"></i></span>
        <span><i class="fa-solid fa-gear fa-lg"></i></span>
      </div>
    </header>

    <a id="friends-display" href="#">
      <i class="fa-solid fa-circle-info"></i>Friends' Names Display
      <i class="fa-solid fa-chevron-right fa-xs"></i>
    </a>
    <main class="main-screen friends-screen">
      <div class="user-component">
        <div class="user-component__column">
          <img
            src="https://avatars.githubusercontent.com/u/143333762?v=4"
            class="user-component__avatar"
          />
        </div>
        <div class="user-component__column">
          <h4 class="user-component__text">Hyeongjun</h4>
          <!-- <h6 class="user-component__subtitle">this is a subtitle</h6> -->
        </div>
        <div class="user-component__column"></div>
      </div>
    </main>
  </body>
  <script
    src="https://kit.fontawesome.com/3af4690456.js"
    crossorigin="anonymous"
  ></script>
</html>
