<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends - rjtalk</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="status-bar">
      <div class="status-bar__column">
        <span>23:30</span>
      </div>
      <div class="status-bar__column">
        <div class="punch-hole"></div>
      </div>
      <div class="status-bar__column">
        <i class="fa-solid fa-signal fa-lg"></i>
        <span>5G</span>
        <i class="fa-solid fa-battery-full fa-2x"></i>
      </div>
    </div>
    <header class="screen-header">
      <h1 class="screen-header__title">Friends</h1>
      <div class="screen-header__icons">
        <span><i class="fa-solid fa-magnifying-glass fa-lg"></i></span>
        <span><i class="fa-solid fa-user-plus fa-lg"></i></span>
        <span><i class="fa-solid fa-music fa-lg"></i></span>
        <span><i class="fa-solid fa-gear fa-lg"></i></span>
      </div>
    </header>

    <a id="friends-display" href="#">
      <i class="fa-solid fa-circle-info"></i>Friends' Names Display
      <i class="fa-solid fa-chevron-right fa-xs"></i>
    </a>
    <main class="main-screen friends-screen">
      <div class="user-component">
        <div class="user-component__column">
          <img
            src="https://avatars.githubusercontent.com/u/143333762?v=4"
            class="user-component__avatar user-component__avatar--l"
          />
          <div class="user-component__text">
            <h4 class="user-component__title">ryeongjun</h4>
            <!-- <h6 class="user-component__subtitle">this is a subtitle</h6> -->
          </div>
        </div>
        <div class="user-component__column"></div>
      </div>
      <div class="friends-screen__channel">
        <div class="friends-screen__channel-header">
          <span>Friends</span><span>3</span>
        </div>

        <div class="user-component">
          <div class="user-component__column">
            <img
              src="https://i.namu.wiki/i/JqXkB47VuslQ36F04iAh2FowCOUw9XeTsO0SrvETGDWxr4CzGAX20Gvm8AL0C1-xhY6q10Uuz1UUFTLvkGCuMfsd9LHxM4fW_lc45M-2L_P3o4PbQLsKqI67-08C59HwqTj3vOemIrgNP5SEzM4ZJA.webp"
              class="user-component__avatar user-component__avatar--s"
            />
            <div class="user-component__text">
              <h4 class="user-component__title user-component__title--s">
                Ron Weasley
              </h4>
              <h6 class="user-component__subtitle">
                I was up until 1 AM last night...
              </h6>
            </div>
          </div>
          <div class="user-component__column"></div>
        </div>
        <div class="user-component">
          <div class="user-component__column">
            <img
              src="https://i.namu.wiki/i/dgskYJzCeRVrbywCXsknNXRbbgJWwuUIjpli_Rh9w5CnvyKeSbp2aNTtWkYLTk4qdMwv2oyO_OF9wCVUV-fPt37GqbnDE4c1mTdkQF4QETMUd2sO4lDeEi6Vnw1RMvCr_t0KR-uRtJPSnkuIHeXoaA.webp"
              class="user-component__avatar user-component__avatar--s"
            />
            <div class="user-component__text">
              <h4 class="user-component__title user-component__title--s">
                Severus Snape
              </h4>
              <h6 class="user-component__subtitle">Always.</h6>
            </div>
          </div>
          <div class="user-component__column"></div>
        </div>
        <div class="user-component">
          <div class="user-component__column">
            <img
              src="https://i.namu.wiki/i/9gVXScHTM4pG-87TIxwxYcX79Mbu5pEjgm8qXHI7Z-NyRkl8T5u1eELL6TV3imij9gTrScLl3_9ybYaMjxL458yr_3r1Y6ZipR1EQD_PMk93xc6FsUMA-uYAJf-Ow04cJPIdWv1EcQcEgTC-fX3IfA.webp"
              class="user-component__avatar user-component__avatar--s"
            />
            <div class="user-component__text">
              <h4 class="user-component__title user-component__title--s">
                Dobby
              </h4>
              <h6 class="user-component__subtitle">
                Dobby is free... but bored :(
              </h6>
            </div>
          </div>
          <div class="user-component__column"></div>
        </div>
      </div>
    </main>
    <nav class="nav">
      <ul class="nav__list">
        <li class="nav__btn">
          <a href="friends.html"><i class="fa-solid fa-user fa-2x"></i></a>
        </li>
        <li class="nav__btn">
          <a href="chats.html"
            ><i class="fa-regular fa-comment fa-2x"></i>
            <span class="badge-alert">1</span></a
          >
        </li>
        <li class="nav__btn">
          <a href="find.html"
            ><i class="fa-solid fa-magnifying-glass fa-2x"></i
          ></a>
        </li>
        <li class="nav__btn">
          <a href="more.html"><i class="fa-solid fa-ellipsis fa-2x"></i></a>
          <div class="badge-more"></div>
        </li>
      </ul>
    </nav>
    <div id="splash-screen">
      <i class="fa-solid fa-comment"></i>
    </div>
    <div id="no-mobile">
      <span>Your screen is too big :(</span>
      <span>Please reduce the width to 600px or less.</span>
    </div>
  </body>
  <script
    src="https://kit.fontawesome.com/3af4690456.js"
    crossorigin="anonymous"
  ></script>
</html>
